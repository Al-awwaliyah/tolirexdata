name: Deploy TolirexData Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: swjojapsfbzxnfvclsui
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          supabase functions deploy clubkonnect-sync-catalogue --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy submit-kyc --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy review-kyc --project-ref "$SUPABASE_PROJECT_REF"
