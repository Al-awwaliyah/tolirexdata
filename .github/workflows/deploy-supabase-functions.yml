name: Deploy TolirexData Supabase Edge Functions

on:
  push:
    branches:
      - feat/tolirexdata-platform-foundation
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"

permissions:
  contents: read

concurrency:
  group: tolirexdata-edge-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: swjojapsfbzxnfvclsui
        run: |
          set -euo pipefail

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing Supabase project reference"
            exit 1
          fi

          if [ ! -d "supabase/functions" ]; then
            echo "No supabase/functions directory found"
            exit 1
          fi

          function_count=0
          for function_dir in supabase/functions/*/; do
            [ -d "$function_dir" ] || continue
            function_name="$(basename "$function_dir")"
            [ "$function_name" = "_shared" ] && continue

            echo "Deploying Edge Function: $function_name"
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --yes
            function_count=$((function_count + 1))
          done

          if [ "$function_count" -eq 0 ]; then
            echo "No deployable Edge Functions found"
            exit 1
          fi

          echo "Successfully deployed $function_count Edge Function(s)."
